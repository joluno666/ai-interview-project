<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AI 应用</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .section { margin-bottom: 30px; }
        #image-container img { max-width: 100%; margin-top: 10px; border: 2px solid #ccc; }
        pre { background: #f4f4f4; padding: 10px; }
    </style>
</head>
<body>
    <h2>聊天</h2>
    <div class="section">
        <input type="text" id="msg-input" placeholder="输入消息...">
        <button onclick="sendChat()">发送</button>
        <pre id="chat-output"></pre>
    </div>

    <h2>YOLO 检测</h2>
    <div class="section">
        <input type="file" id="image-input" accept="image/*">
        <button onclick="sendImage()">检测</button>
        <div id="image-container"></div>
    </div>

    <script>
        // 聊天功能
        async function sendChat() {
            const input = document.getElementById('msg-input');
            const output = document.getElementById('chat-output');
            const msg = input.value;
            if (!msg) return;
            
            output.textContent = "思考中...";
            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ message: msg })
                });
                const data = await res.json();
                output.textContent = data.reply;
            } catch (e) {
                output.textContent = "请求失败，请检查 Ollama 是否开启。";
            }
        }

        // 图片检测功能
        async function sendImage() {
            const fileInput = document.getElementById('image-input');
            const container = document.getElementById('image-container');
            
            if (!fileInput.files[0]) {
                alert("请先选择一张图片！");
                return;
            }
            
            container.innerHTML = "检测中，请稍候...";
            const formData = new FormData();
            formData.append('image', fileInput.files[0]);
            
            try {
                const res = await fetch('/detect', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                // 直接动态插入图片，避开 id 找不到的问题
                const img = document.createElement('img');
img.src = 'data:image/jpeg;base64,' + data.image;
img.style.maxWidth = '100%';
container.innerHTML = '';
container.appendChild(img);
            } catch (e) {
                container.innerHTML = "检测失败，请检查后端。";
            }
        }
    </script>
</body>
</html>
